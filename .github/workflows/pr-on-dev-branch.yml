  name: validation

  on:
    pull_request:
      types:
        - opened
        - synchronize
      paths:
        - force-app/**
      branches:
        - test
        #- uat
        #- pre-prod

  run-name: Validating for ${{ github.ref_name }} by ${{ github.actor }}

  jobs:
    validation:
      runs-on: ubuntu-latest

      steps:
        - uses: actions/setup-node@v4
          with:
            node-version: "20"

        - name: Checkout source code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Install Salesforce CLI
          run: |
            wget https://developer.salesforce.com/media/salesforce-cli/sf/channels/stable/sf-linux-x64.tar.xz
            mkdir ~/sf
            tar xJf sf-linux-x64.tar.xz -C ~/sf --strip-components 1
            echo "$HOME/sf/bin" >> $GITHUB_PATH
            ~/sf/bin/sf version

        # Get the Integration Org SFDX URL and store it in a text file
        - name: Populate auth file with SFDX_URL secret of target org
          run: |
            echo ${{ secrets.Sandbox_URL}} > ./PROD_URL.txt

        # Authenticate to org using the URL stored in the text file
        - name: Authenticate to target Org
          run: sf org login sfdx-url --sfdx-url-file ./PROD_URL.txt --set-default --alias AMCSOrg

        - name: Validation - run all tests
          run: sf project deploy start --manifest deployment/package.xml --post-destructive-changes deployment/postDestructiveChanges.xml --dry-run --test-level RunLocalTests --target-org AMCSOrg --concise


    merge-pr:
      runs-on: ubuntu-latest
      needs: validation
      steps:
        - name: Merge pull request
          uses: actions/github-script@v6
          with:
            script: |
              const prNumber = context.issue.number;
              const owner = context.repo.owner;
              const repo = context.repo.repo;

              // Check if all checks have passed
              const checks = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: context.sha
              });

              const allChecksPassed = checks.data.check_runs.every(check => check.conclusion === 'success');

              if (allChecksPassed) {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: prNumber,
                  merge_method: 'squash'
                });
              } else {
                console.log("Not all checks have passed. PR will not be merged.");
              }
